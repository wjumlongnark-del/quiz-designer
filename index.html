<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวออกแบบ Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Prompt:wght@300;400;600&family=Kanit:wght@300;400;600&family=Mali:wght@400;600&family=Pridi:wght@400;600&family=Trirong:wght@400;600&family=Taviraj:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f1ec;--ink:#1d2433;--mut:#6a7287;--line:#d9d5cb;--pri:#1f5f5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',sans-serif;line-height:1.6}
.wrap{max-width:1600px;margin:0 auto;padding:24px 16px 60px}
.app{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:20px;align-items:start}
.right{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.right .tb{margin:0 0 10px}
#hint{color:var(--mut);text-align:center;margin:80px 20px}
#qwrap{margin:0 auto;position:relative}
h1.pg{font-size:1.9rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 24px}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.sec h2{font-size:1.1rem;margin:0 0 12px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.row .n{flex:0 0 28px;padding-top:9px;color:var(--mut);text-align:right}
.btn{font:inherit;font-weight:600;border:1px solid var(--pri);background:var(--pri);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.o{background:#fff;color:var(--pri)}
.btn.d{background:#fff;color:#b3261e;border-color:#e3b5b1;padding:8px 12px}
.btn:hover{filter:brightness(.95)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{border:2px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;background:#fff;font:inherit;font-size:.8rem;text-align:left}
.th i{display:flex;align-items:center;justify-content:center;height:38px;border-radius:5px;margin-bottom:4px;font-style:normal;font-weight:700;border:1px solid #ccc}
.th[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.stage{overflow:auto;padding:12px;background:#d9d6cf;border-radius:10px;flex:1;min-height:0}

/* ===== Quiz paper (no color-mix / columns / outline: html2canvas-safe) ===== */
.qz{width:794px;margin:0;transform-origin:top left;padding:48px 52px;background:var(--p);color:var(--k);font-family:var(--f);font-size:16px;line-height:1.6;position:relative;overflow:hidden}
.qz *{box-sizing:border-box}
.qz h1{margin:0;font-size:2.1rem;line-height:1.25;color:var(--a);font-weight:700}
.qz .ins{margin:22px 0 26px;padding:14px 18px;border-radius:8px;background:rgba(128,128,128,.12)}
.qz .ins b{color:var(--a)}
.qz .ins ol{margin:6px 0 0;padding-left:24px}
.qz .ins li,.qz .qt{white-space:pre-wrap;word-break:break-word}
.qz .q{display:flex;gap:12px;margin:0 0 20px}
.qz .no{flex:0 0 auto;min-width:34px;font-weight:700;color:var(--a)}
.qz .qb{flex:1;min-width:0}
.qz .qt{display:block}
.qz .ans{margin-top:8px}
.qz .ans.l div{height:26px;border-bottom:1px dotted var(--k)}
.qz .ans.b div{height:72px;border:1.5px solid var(--a);border-radius:6px}
.qz .ans.s div{height:26px;border-bottom:1.5px solid var(--a);width:60%}
.qz .ans.n{display:none}

/* 0 ข้อสอบคลาสสิก */
.t0 .hd{text-align:center;border-top:5px solid var(--a);border-bottom:1px solid var(--a);padding:16px 0}
/* 1 แถบด้านข้าง */
.t1{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;padding:0;background-image:linear-gradient(90deg,var(--a) 230px,var(--p) 230px)}
.t1 .hd{grid-column:1;padding:44px 24px 10px}.t1 h1{color:var(--p);font-size:1.7rem}
.t1 .ins{grid-column:1;margin:0;background:none;color:var(--p);padding:10px 24px}.t1 .ins b{color:var(--p)}
.t1 .qs{grid-column:2;grid-row:1/3;padding:44px 40px 24px 36px}
/* 2 สองคอลัมน์ */
.t2 .hd{border-bottom:6px solid var(--a);padding-bottom:10px}
.t2 .qs{display:grid;grid-template-columns:1fr 1fr;gap:6px 36px}
.t2 .q{border-top:2px solid var(--a);padding-top:8px;margin:0 0 14px}
/* 3 การ์ดลอย */
.t3 .q{background:#fff;padding:16px 18px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);border-left:7px solid var(--a);margin-bottom:18px}
/* 4 ไทม์ไลน์ */
.t4 .qs{position:relative;padding-left:30px}
.t4 .qs:before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:3px;background:var(--a)}
.t4 .q{position:relative}
.t4 .q:before{content:"";position:absolute;left:-23px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--p);border:4px solid var(--a)}
/* 5 สมุดโน้ต */
.t5{padding-left:96px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#9cc5e8 31px,#9cc5e8 32px)}
.t5:before{content:"";position:absolute;left:68px;top:0;bottom:0;width:2px;background:#e57373}
.t5 *{line-height:32px}.t5 .ins{background:none;margin:32px 0;padding:0}.t5 .q{margin-bottom:32px}.t5 .ans{margin:0}.t5 .ans.l div{height:32px;border:0}
/* 6 เทอร์มินัล */
.t6{border:3px solid var(--a)}
.t6 .hd{border-bottom:1px dashed var(--a);padding-bottom:12px}.t6 h1{font-size:1.6rem}.t6 h1:before{content:"> "}
.t6 .ins{background:rgba(46,230,107,.08);border:1px solid var(--a);border-radius:2px}
.t6 .q{border:1px solid var(--a);padding:12px 14px;border-radius:2px;background:rgba(46,230,107,.06)}
/* 7 หนังสือพิมพ์ */
.t7 .hd{text-align:center;border-top:6px double var(--k);border-bottom:6px double var(--k);padding:12px 0}.t7 h1{font-size:2.8rem;color:var(--k)}
.t7 .ins{border:1px solid var(--k);background:none;border-radius:0}
.t7 .qs{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.t7 .q{border-bottom:1px solid var(--k);padding-bottom:12px}
/* 8 กรอบประ */
.t8{padding:64px 74px}
.t8:before{content:"";position:absolute;left:16px;top:16px;right:16px;bottom:16px;border:3px dashed var(--a);border-radius:22px}
.t8 .hd{text-align:center}
/* 9 คอมิก */
.t9{background-image:radial-gradient(var(--b) 22%,transparent 24%);background-size:14px 14px}
.t9 .hd{background:var(--a);border:4px solid #000;box-shadow:8px 8px 0 #000;padding:14px 20px;transform:rotate(-1deg)}.t9 h1{color:#fff}
.t9 .ins{background:#fff;border:3px solid #000;color:#111;border-radius:6px}
.t9 .q{background:#fff;color:#111;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:12px 16px;border-radius:6px}
.t9 .no{background:var(--b);color:#000;border:3px solid #000;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
/* 10 ใบประกาศ */
.t10{text-align:center;border:12px double var(--a)}
.t10 h1{font-size:2.5rem}.t10 .hd:after{content:"✦  ✦  ✦";display:block;color:var(--a);letter-spacing:8px;margin-top:6px}
.t10 .ins{text-align:left}
.t10 .q{flex-direction:column;align-items:center;gap:2px}.t10 .ans div{margin:0 auto}
/* 11 โพสต์อิท */
.t11 .ins{background:var(--b);color:#2b2b2b;border-radius:0;box-shadow:3px 5px 8px rgba(0,0,0,.2)}.t11 .ins b{color:#2b2b2b}
.t11 .qs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.t11 .q{background:var(--b);color:#2b2b2b;padding:18px;box-shadow:3px 5px 8px rgba(0,0,0,.25);transform:rotate(-1.2deg);margin:0;flex-direction:column;gap:2px}
.t11 .q:nth-child(even){transform:rotate(1.4deg)}.t11 .no{color:#2b2b2b}
/* 12 แชต */
.t12 .q{max-width:84%;background:var(--b);padding:12px 18px;border-radius:22px 22px 22px 4px}
.t12 .q:nth-child(even){margin-left:auto;background:var(--a);color:var(--p);border-radius:22px 22px 4px 22px}.t12 .q:nth-child(even) .no{color:var(--p)}
/* 13 พิมพ์เขียว */
.t13{background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:24px 24px}
.t13 .hd{border:2px solid var(--a);padding:14px 18px}.t13 .ins{background:none;border:1px dashed var(--a)}
.t13 .q{border:1px dashed var(--a);padding:10px 14px}.t13 .no{border-right:1px solid var(--a);padding-right:12px}
/* 14 ตัวเลขยักษ์ */
.t14 .hd{border-bottom:2px solid var(--k);padding-bottom:14px}.t14 h1{font-weight:300;font-size:2.6rem}
.t14 .no{font-size:3.6rem;line-height:1;font-weight:300;min-width:84px;color:var(--b)}
.t14 .q{border-bottom:1px solid #ddd;padding-bottom:12px}
/* 15 แบนเนอร์เต็ม */
.t15{padding:0}.t15 .hd{background:var(--a);padding:46px 52px 30px}.t15 h1{color:var(--p);font-size:2.5rem}
.t15 .ins{margin:0;border-radius:0;background:var(--b)}.t15 .ins{padding:20px 52px}.t15 .qs{padding:28px 52px 36px}
.t15 .no{background:var(--a);color:var(--p);padding:2px 14px;border-radius:0 14px 14px 0;height:32px;margin-left:-52px;padding-left:52px;min-width:90px}
/* 16 ตั๋ว */
.t16 .q{background:var(--b);padding:14px 22px;border-radius:10px;position:relative;border-left:3px dashed var(--a);margin-bottom:18px}
.t16 .q:before,.t16 .q:after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--p)}
.t16 .q:before{top:-9px}.t16 .q:after{bottom:-9px}
/* 17 กระดานดำ */
.t17{border:14px solid #8b5a2b}.t17 .hd h1{text-align:center;padding-bottom:10px;border-bottom:3px dashed var(--k);color:var(--k)}
.t17 .ins{background:none;border:2px dashed rgba(255,255,255,.5)}
.t17 .q{border-bottom:2px dashed rgba(255,255,255,.35);padding-bottom:12px}
.t17 .no{border:2px solid var(--k);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--k)}
/* 18 ตาราง */
.t18 .qs{border:2px solid var(--k)}
.t18 .q{margin:0;gap:0;border-bottom:1px solid var(--k)}.t18 .q:last-child{border-bottom:0}
.t18 .no{width:76px;min-width:76px;padding:12px;border-right:2px solid var(--k);background:var(--b);text-align:center;color:var(--k)}.t18 .qb{padding:12px 16px}
/* 19 การ์ดดัชนี */
.t19 .qs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.t19 .q{position:relative;flex-direction:column;gap:0;margin:0;background:#fff;color:#222;border:1px solid #999;border-top:32px solid var(--a);padding:12px 16px}
.t19 .no{position:absolute;top:-30px;left:12px;color:#fff}
/* 20 นิตยสาร */
.t20 .hd{background:var(--b);padding:28px 52px;margin:-48px -52px 26px;border-bottom:8px solid var(--a)}.t20 h1{font-size:2.7rem;color:var(--k)}
.t20 .q{border-left:7px solid var(--a);padding-left:16px}.t20 .q:nth-child(even){margin-left:44px}
/* 21 เรโทร 80s */
.t21{background-image:linear-gradient(180deg,var(--p) 0,var(--p) 55%,#5a1a7a 100%)}
.t21 .hd{background:repeating-linear-gradient(var(--a) 0,var(--a) 8px,var(--b) 8px,var(--b) 16px);padding:22px;border-radius:6px}
.t21 h1{color:#fff;background:#2b1055;padding:8px 18px;border-radius:4px}
.t21 .ins b{color:var(--b)}
.t21 .no{background:var(--a);color:#fff;border-radius:4px;padding:0 10px;height:30px;text-align:center}
/* 22 หน้าหนังสือ */
.t22{padding:64px 84px;text-align:justify}.t22 .hd{text-align:center}
.t22 .hd:before{content:"❦";display:block;font-size:2rem;color:var(--a)}.t22 h1{font-weight:400;font-style:italic}
.t22 .no{font-weight:400;font-style:italic;min-width:52px}.t22 .ins{background:none;border-top:1px solid var(--k);border-bottom:1px solid var(--k);border-radius:0}
/* 23 เม็ดยา */
.t23 h1{background:var(--a);color:var(--p);padding:12px 30px;border-radius:999px;display:inline-block}
.t23 .ins{border-radius:26px;background:var(--b)}
.t23 .q{flex-direction:column;gap:6px;background:var(--b);padding:16px 22px;border-radius:28px}
.t23 .no{align-self:flex-start;background:var(--a);color:var(--p);padding:0 18px;border-radius:999px;font-size:.9rem}
/* 24 เกมด่าน */
.t24 .hd{background:var(--a);padding:20px;border:4px solid var(--b);border-radius:6px;text-align:center}.t24 h1{color:#fff}
.t24 .ins{border:2px solid var(--b);background:none}.t24 .ins b{color:var(--b)}
.t24 .q{position:relative;flex-direction:column;gap:4px;border:3px solid var(--a);border-radius:4px;padding:12px 16px}
.t24 .no{align-self:flex-start;background:var(--a);color:#fff;padding:0 14px;border-radius:3px}
.t24 .q:after{content:"";position:absolute;right:14px;top:14px;width:64px;height:10px;border:2px solid var(--b);background:linear-gradient(90deg,var(--b) 40%,transparent 40%)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.right{position:static;height:auto}.stage{max-height:80vh}}
@media(max-width:600px){.row .n{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="pg">ตัวออกแบบ Quiz</h1>
  <p class="sub">กรอกข้อมูล เลือกรูปแบบหน้า แล้วกดประมวลผลเพื่อสร้างหน้า Quiz</p>

  <div class="app">
  <div class="left">
    <div class="sec"><h2>ชื่อ Quiz</h2><input type="text" id="title" placeholder="เช่น แบบทดสอบวิทยาศาสตร์ ม.1"></div>
    <div class="sec"><h2>คำชี้แจง</h2><div id="insList"></div><div class="bar"><button class="btn o" onclick="addI()">+ เพิ่มคำชี้แจง</button></div></div>
    <div class="sec"><h2>คำถาม</h2><div id="qList"></div><div class="bar"><button class="btn o" onclick="addQ()">+ เพิ่มคำถาม</button></div></div>
    <div class="sec"><h2>รูปแบบหน้า (25 แบบ)</h2><div class="themes" id="themes"></div></div>
    <div class="bar">
      <button class="btn" onclick="process()">ประมวลผล</button>
      <button class="btn o" onclick="sample()">ทดลองตัวอย่างอัตโนมัติ</button>
      <button class="btn d" onclick="resetAll()">Reset หน้า</button>
    </div>
  </div>
  <div class="right" id="out">
    <div class="bar tb">
      <button class="btn" onclick="dlPNG()">ดาวน์โหลด PNG</button>
      <button class="btn" onclick="dlPDF()">ดาวน์โหลด PDF</button>
      <span id="msg" style="align-self:center;color:var(--mut)"></span>
    </div>
    <div class="stage" id="stage">
      <p id="hint">กด “ประมวลผล” หรือ “ทดลองตัวอย่างอัตโนมัติ”<br>หน้า Quiz จะแสดงตรงนี้ และเปลี่ยนตามรูปแบบที่เลือกทันที</p>
      <div id="qwrap" style="display:none"><div id="quiz" class="qz"></div></div>
    </div>
  </div>
  </div>
</div>

<script>
const F={n:i=>i+'.',k:i=>'ข้อ '+i,Q:i=>'Q'+i,h:i=>'#'+i,L:i=>'ด่าน '+i,T:i=>'['+i+']',
 p0:i=>String(i).padStart(2,'0'),
 th:i=>String(i).replace(/\d/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]),
 r:i=>{const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';m.forEach(([v,c])=>{while(i>=v){s+=c;i-=v}});return s+'.'}};
// [ชื่อ, กระดาษ, ตัวอักษร, สีหลัก, สีรอง, ฟอนต์, รูปแบบเลขข้อ, ช่องตอบ(l=เส้น b=กล่อง s=เส้นสั้น n=ไม่มี)]
const T=[
["1 ข้อสอบคลาสสิก","#fffdf8","#1a1a1a","#8b1a1a","#d9c9a8","Trirong","k","l"],
["2 แถบด้านข้าง","#ffffff","#1b2a3a","#1f5f8b","#17405c","Prompt","p0","s"],
["3 สองคอลัมน์","#fafafa","#222222","#0a7d6b","#bde6dd","Sarabun","n","l"],
["4 การ์ดลอย","#eef1f8","#1c2340","#4059d6","#e3e8fb","Kanit","n","s"],
["5 ไทม์ไลน์","#fbfaf5","#1f2d2a","#1b8a6b","#cfe9df","Pridi","p0","l"],
["6 สมุดโน้ต","#fffef7","#1d2a44","#c0392b","#9cc5e8","Mali","th","l"],
["7 เทอร์มินัล","#0c1410","#7dff9b","#2ee66b","#0f2a1a","Courier New","T","s"],
["8 หนังสือพิมพ์","#f4efe4","#1a1a1a","#1a1a1a","#cfc6b0","Taviraj","k","l"],
["9 กรอบประ","#fff8f0","#3a2a1a","#b85a14","#ffe1c2","Mali","n","l"],
["10 คอมิก","#fff4c2","#111111","#d62828","#ffd23f","Kanit","h","b"],
["11 ใบประกาศ","#fffaf0","#3a2a10","#8a6212","#e8d39a","Trirong","r","s"],
["12 โพสต์อิท","#f1ede4","#2b2b2b","#d6452d","#ffe66d","Mali","n","l"],
["13 แชตฟองสบู่","#f2f6fb","#1d2b3a","#1a5fb4","#dcebfc","Prompt","Q","s"],
["14 พิมพ์เขียว","#123b6d","#e8f1ff","#9fd0ff","#9fd0ff","Courier New","p0","l"],
["15 ตัวเลขยักษ์","#ffffff","#111111","#111111","#767676","Prompt","p0","l"],
["16 แบนเนอร์เต็ม","#ffffff","#1a1a2e","#c92a42","#ffe3e0","Kanit","n","l"],
["17 ตั๋วเจาะรู","#fdf3e1","#2a1f12","#a82e20","#fbd9a8","Kanit","p0","s"],
["18 กระดานดำ","#26473a","#f4f4ec","#f7e9a0","#ffffff","Mali","n","l"],
["19 ตารางสอบ","#ffffff","#111827","#111827","#e5e7eb","Sarabun","n","b"],
["20 การ์ดดัชนี","#e9f0f7","#1c2733","#b85a0a","#ffffff","Prompt","Q","l"],
["21 นิตยสาร","#fffaf5","#241a1a","#e11d48","#ffd6e0","Pridi","p0","l"],
["22 เรโทร 80s","#2b1055","#fbe9ff","#d4146f","#27d3f5","Kanit","h","s"],
["23 หน้าหนังสือ","#f7f1e3","#2b2118","#7a3e1d","#c9b38c","Taviraj","k","l"],
["24 เม็ดยา","#fdf4ff","#2d1b3d","#7e2fd0","#f3e1fb","Prompt","n","s"],
["25 เกมด่าน","#101826","#e7eefc","#d9480f","#ffd23f","Kanit","L","s"]];
let sel=0,shown=false;const $=id=>document.getElementById(id);

function row(listId,ph,val){
  const l=$(listId),d=document.createElement('div');d.className='row';
  d.innerHTML='<span class="n"></span><textarea placeholder="'+ph+'"></textarea><button class="btn d" onclick="del(this,\''+listId+'\')">ลบ</button>';
  d.querySelector('textarea').value=val||'';l.appendChild(d);num(l);
}
function num(l){[...l.children].forEach((r,i)=>r.querySelector('.n').textContent=i+1+'.')}
function del(b,id){const l=$(id);if(l.children.length<=1){b.previousElementSibling.value='';return}b.parentNode.remove();num(l)}
function addI(v){row('insList','พิมพ์คำชี้แจง...',v)}
function addQ(v){row('qList','พิมพ์คำถาม...',v)}

function buildThemes(){
  $('themes').innerHTML='';
  T.forEach((t,i)=>{
    const b=document.createElement('button');b.className='th';b.setAttribute('aria-pressed',i===sel);
    b.innerHTML='<i style="background:'+t[1]+';color:'+t[3]+';font-family:\''+t[5]+'\',Sarabun">'+F[t[6]](1)+'</i>'+t[0];
    b.onclick=()=>{sel=i;buildThemes();if(shown)process(true)};$('themes').appendChild(b);
  });
}
function fit(){
  if(!shown)return;
  const q=$('quiz'),w=$('stage').clientWidth-24,k=Math.min(1,w/794);
  q.style.transform='scale('+k+')';
  const wr=$('qwrap');wr.style.width=Math.floor(794*k)+'px';wr.style.height=Math.ceil(q.offsetHeight*k)+'px';
}
addEventListener('resize',fit);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function vals(id){return [...$(id).querySelectorAll('textarea')].map(t=>t.value.trim()).filter(Boolean)}

function process(keep){
  const t=T[sel],q=$('quiz'),title=$('title').value.trim()||'Quiz ไม่มีชื่อ';
  const ins=vals('insList'),qs=vals('qList');
  q.className='qz t'+sel;
  q.style.cssText='--p:'+t[1]+';--k:'+t[2]+';--a:'+t[3]+';--b:'+t[4]+';--f:\''+t[5]+'\',Sarabun,sans-serif';
  q.innerHTML='<div class="hd"><h1>'+esc(title)+'</h1></div>'+
   (ins.length?'<div class="ins"><b>คำชี้แจง</b><ol>'+ins.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>':'')+
   '<div class="qs">'+(qs.length?qs.map((s,i)=>'<div class="q"><span class="no">'+F[t[6]](i+1)+'</span><div class="qb"><span class="qt">'+esc(s)+'</span></div></div>').join(''):'<p>ยังไม่มีคำถาม</p>')+'</div>';
  shown=true;$('hint').style.display='none';$('qwrap').style.display='block';$('msg').textContent='';
  fit();
  if(!keep&&matchMedia('(max-width:1000px)').matches)$('out').scrollIntoView({behavior:'smooth'});
}

function sample(){
  $('title').value='แบบทดสอบความรู้รอบตัว';
  $('insList').innerHTML='';$('qList').innerHTML='';
  ['อ่านคำถามให้ครบทุกข้อก่อนตอบ','เขียนคำตอบให้ชัดเจนในช่องว่างใต้คำถาม','ใช้เวลาทำแบบทดสอบไม่เกิน 30 นาที'].forEach(addI);
  ['เมืองหลวงของประเทศไทยคือเมืองอะไร และมีชื่อเต็มอย่างไร',
   'น้ำเดือดที่อุณหภูมิกี่องศาเซลเซียส ที่ความดันบรรยากาศปกติ',
   'ดาวเคราะห์ดวงใดในระบบสุริยะมีขนาดใหญ่ที่สุด',
   'จงอธิบายว่าการสังเคราะห์ด้วยแสงของพืชคืออะไร และสำคัญต่อสิ่งมีชีวิตอย่างไร',
   'จงยกตัวอย่างพลังงานทดแทนมา 2 ชนิด พร้อมข้อดีของแต่ละชนิด'].forEach(addQ);
  sel=Math.floor(Math.random()*T.length);buildThemes();process();
}
function resetAll(){
  $('title').value='';$('insList').innerHTML='';$('qList').innerHTML='';
  for(let i=0;i<3;i++)addI();for(let i=0;i<5;i++)addQ();
  sel=0;shown=false;buildThemes();$('qwrap').style.display='none';$('hint').style.display='block';$('quiz').innerHTML='';$('msg').textContent='';
}

/* ===== Download ===== */
function fname(){return ($('title').value.trim()||'quiz').replace(/[\\\/:*?"<>|]/g,'_')}
function say(m){$('msg').textContent=m}
function save(blob,name){
  if(window.navigator.msSaveOrOpenBlob){window.navigator.msSaveOrOpenBlob(blob,name);return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);
}
async function snap(){
  if(typeof html2canvas==='undefined')throw new Error('โหลดไลบรารีไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const src=$('quiz'),holder=document.createElement('div'),el=src.cloneNode(true);
  holder.style.cssText='position:absolute;left:-10000px;top:0;width:794px';
  el.removeAttribute('id');el.style.transform='none';holder.appendChild(el);document.body.appendChild(holder);
  try{
    return await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(src).getPropertyValue('--p').trim()||'#fff',
      useCORS:true,logging:false,scrollX:0,scrollY:-window.scrollY,width:794,height:el.offsetHeight});
  }finally{holder.remove()}
}
async function dlPNG(){
  say('กำลังสร้างไฟล์...');
  try{
    const c=await snap();
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(!blob)throw new Error('สร้างรูปไม่สำเร็จ');
    save(blob,fname()+'.png');say('ดาวน์โหลด PNG แล้ว');
  }catch(e){say('ผิดพลาด: '+e.message)}
}
async function dlPDF(){
  say('กำลังสร้างไฟล์...');
  try{
    if(!window.jspdf)throw new Error('โหลด jsPDF ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
    const c=await snap(),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'p'});
    const W=210,H=297,ih=c.height*W/c.width,img=c.toDataURL('image/jpeg',0.95);
    const hex=getComputedStyle($('quiz')).getPropertyValue('--p').trim();
    const rgb=[1,3,5].map(i=>parseInt(hex.substr(i,2),16));
    let y=0,first=true;
    while(y<ih-0.5){
      if(!first)pdf.addPage();first=false;
      pdf.setFillColor(rgb[0],rgb[1],rgb[2]);pdf.rect(0,0,W,H,'F');
      pdf.addImage(img,'JPEG',0,-y,W,ih);
      y+=H;
    }
    save(pdf.output('blob'),fname()+'.pdf');say('ดาวน์โหลด PDF แล้ว');
  }catch(e){say('ผิดพลาด: '+e.message)}
}

for(let i=0;i<3;i++)addI();for(let i=0;i<5;i++)addQ();buildThemes();
</script>
